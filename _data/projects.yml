- slug: trex-tokenizer-regression
  title: "TReX: Tokenizer Regression for Optimal Data Mixture"
  venue: "EACL 2026"
  year: 2026
  date: 2026-03-24
  authors: ["Inho Won", "Hangyeol Yoo", "Minkyung Cho", "Jungyeul Park", "Hoyun Song", "KyungTae Lim"]
  summary: "TReX predicts the optimal multilingual data mixture for tokenizer training with a regression model fitted on small proxy tokenizers; tokenizers trained on its mixture outperform LLaMA3-based and uniform mixtures by up to 12% in in- and out-of-distribution compression efficiency."
  thumbnail: /assets/img/projects/trex-tokenizer-regression.png
