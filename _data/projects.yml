  pdf: https://arxiv.org/pdf/2609.02153

- slug: melon-video-retrieval
  title: "MELON: A Large-Scale Dataset for Multi-Event Text-to-Long-Video Retrieval"
  venue: "arXiv 2026"
  year: 2026
  date: 2026-08-31
  authors: ["Chan Hur", "SeungWoo Song", "Jeong-hun Hong", "Won Jun Oh", "Hyeyoung Park", "KyungTae Lim"]
  summary: "MELON is a large-scale text-to-video retrieval dataset of 12,000 long-form videos with 42,526 annotated events, where each query describes 3-5 events of one video. The proposed multi-event aware (MEA) loss improves all seven evaluated retrieval models, e.g., raising PAU's text-to-video R@1 from 48.5 to 55.4."
  thumbnail: /assets/img/projects/melon-video-retrieval.png
  thumbnail_alt: "Single-event queries over short clips cause redundant matches in a long-video database, whereas MELON's multi-event queries identify the one long video that contains all queried events."
  paper: https://arxiv.org/abs/2609.01654
  arxiv: https://arxiv.org/abs/2609.01654
  pdf: https://arxiv.org/pdf/2609.01654

- slug: korean-predicate-morphology
  title: "Lexically conditioned realization ambiguity in Korean predicate morphology"
  venue: "arXiv 2026"
  year: 2026
  date: 2026-08-28
  authors: ["Wonjun Oh", "KyungTae Lim", "Jungyeul Park"]
  summary: "This paper shows that a sequence of Korean morphemes and POS labels does not always determine the surface form: homonymous predicates such as 걷다 'walk' (ㄷ-irregular) and 걷다 'clear away' (regular) belong to different conjugation classes. In a KLUE surface reconstruction test, explicit realization constraints raise target-eojeol F1 from 64.96 to 92.56."
  paper: https://arxiv.org/abs/2608.27966
  arxiv: https://arxiv.org/abs/2608.27966
  pdf: https://arxiv.org/pdf/2608.27966

- slug: korean-constituency-granularity
  title: "Representing and Parsing Korean Constituency Structure at Different Levels of Granularity"
  venue: "arXiv 2026"
  year: 2026
  date: 2026-08-27
  authors: ["Jungyeul Park", "KyungTae Lim", "Zihao Huang", "Eunkyul Leah Jo", "Yige Chen", "Chulwoo Park"]
  summary: "This paper derives three constituency representations from the Penn Korean Treebank (Morpheme+XPOS, Eojeol+XPOS, Eojeol+UPOS) and parses them with top-down, in-order, and bottom-up non-binary transition systems. Evaluated on eojeol terminals, Morpheme+XPOS bottom-up parsing reaches 84.76 EVALB F1, versus 70.11 for Eojeol+UPOS."
  thumbnail: /assets/img/projects/korean-constituency-granularity.png
  thumbnail_alt: "The same Penn Korean Treebank sentence as (a) morpheme terminals with XPOS tags, (b) eojeol terminals with combined XPOS tags, and (c) eojeol terminals with UPOS tags."
  paper: https://arxiv.org/abs/2608.27035
  arxiv: https://arxiv.org/abs/2608.27035
  pdf: https://arxiv.org/pdf/2608.27035

