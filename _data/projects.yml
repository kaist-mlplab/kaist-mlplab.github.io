- slug: sign-aware-hard-negatives
  title: "Semantic Hardness Is Not Visual Hardness: Sign-Aware Hard Negative Mining for Sign Language Retrieval"
  venue: "ACL 2026"
  year: 2026
  date: 2026-07-02
  authors: ["Junmyeong Lee", "Chan Hur", "ChangSu Choi", "Sukmin Cho", "Fitsum Gaim", "Eui Jun Hwang", "Hoyun Song", "KyungTae Lim"]
  summary: "Sign-Aware Hard Negative Mining (SAN) builds hard negatives for sign language retrieval from visually confusable signs instead of semantically similar words, raising fine-grained video-to-text R@1 on PHOENIX-2014T from 16.8% to 49.1% while preserving coarse-grained retrieval."
  thumbnail: /assets/img/projects/sign-aware-hard-negatives.png
  thumbnail_alt: "German signs for Europe, October and Scandinavia next to a sign embedding space where SAN negatives lie in the visually confusable region around the query sign."
