  year: 2026
  date: 2026-07-14
  authors: ["Seungdon Yeom", "KyungTae Lim", "Yonggyun Yu"]
  summary: >-
    AtomicGPT is a secure, on-premises nuclear engineering LLM built by domain-adapting open-weight models on
