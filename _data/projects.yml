- slug: tellme
  title: "TELLME: Test-Enhanced Learning for Language Model Enrichment"
  venue: "Findings of EACL 2026"
  year: 2026
  date: 2026-03-24
  authors: ["Minjun Kim", "Inho Won", "HyeonSeok Lim", "MinKyu Kim", "Junghun Yuk", "Wooyoung Go", "Jongyoul Park", "Jungyeul Park", "KyungTae Lim"]
  summary: "TELLME applies test-enhanced learning (the testing effect) to continual pre-training of LLMs by training on domain text together with descriptive quiz-style QA, outperforming existing methods by up to 23.6% in the financial domain and improving long-term knowledge retention by 9.8%."
