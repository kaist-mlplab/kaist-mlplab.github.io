- slug: bock-algorithm-reformulation
  title: "Reformulation and Equivalence of Bock's Algorithm for Exact Dependency Parsing"
  venue: "arXiv 2026"
  year: 2026
  date: 2026-10-31
  authors: ["Yuxi Wang", "Jungyeul Park"]
  summary: >-
    We reformulate Bock's 1971 minimum-cost arborescence algorithm, prove it equivalent to the
    original procedure and to corrected Tarjan / Chu-Liu-Edmonds, and show that inside a biaffine
    dependency parser it returns identical Penn Treebank parses to CL/E on identical scores, making
    it an alternative exact decoder and structured-training oracle.
  arxiv: https://arxiv.org/abs/2611.00939
  pdf: https://arxiv.org/pdf/2611.00939

- slug: chinese-learner-error-taxonomy
  title: "A Layered Taxonomy for Chinese Learner Grammatical Error Annotation"
  venue: "arXiv 2026"
  year: 2026
  date: 2026-09-02
  authors: ["Mengyang Qiu", "Jungyeul Park"]
  summary: >-
    A layered error taxonomy for Chinese learner writing that gives orthographic edits
    op:orth:subtype labels and other edits an op:dom:pos core label with optional pedagogical
    extensions; on 4,426 MuCGEC edits orthographic screening covers 24.0%, and five LLMs agree on
    97.1% of orthographic decisions.
