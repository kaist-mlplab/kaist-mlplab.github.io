  pdf: https://aclanthology.org/2026.acl-long.1302.pdf
  code: https://github.com/joonmy/SAN

- slug: text-mining-vs-human-coders
  title: "Unveiling the Performance Gap Between Deep Text Mining and Human Coders in Environmental Information Extraction"
  venue: "International Journal of Human–Computer Interaction 2026"
  year: 2026
  date: 2026-05-26
  authors: ["JungJin Kim", "Kyungtae Lim", "Jan Adamowski", "Hanseok Jeong"]
  summary: >-
    A BiLSTM text-mining classifier for Korean environmental news reaches over 0.98 accuracy, yet
    agrees with trained human coders less (F1 = 0.76) than the coders agree with each other
    (F1 = 0.89), motivating human-in-the-loop validation.
  paper: https://doi.org/10.1080/10447318.2026.2669061

- slug: elo-layer-specific-optimization
  title: "ELO: Efficient Layer-Specific Optimization for Continual Pretraining of Multilingual LLMs"
  venue: "EACL 2026 Industry"
  year: 2026
  date: 2026-03-25
  authors: ["Hangyeol Yoo", "ChangSu Choi", "Minjun Kim", "Seohyun Song", "SeungWoo Song", "Inho Won", "Jongyoul Park", "Cheoneum Park", "KyungTae Lim"]
  summary: "ELO makes continual pretraining of multilingual LLMs for a target language efficient by training only the detached first and last decoder layers and then realigning them, giving up to 6.46x faster training than full fine-tuning and up to 6.2% better target-language (Korean) generation scores while preserving English."
  thumbnail: /assets/img/projects/elo-layer-specific-optimization.png
  thumbnail_alt: "ELO diagram: the first and last layers are detached from the original model into a small ELO model, trained on the target language, and put back into the original model."
  paper: https://aclanthology.org/2026.eacl-industry.55/
  arxiv: https://arxiv.org/abs/2601.03648
  pdf: https://aclanthology.org/2026.eacl-industry.55.pdf

- slug: bi-gsm8k
  title: "Beyond Accuracy: Alignment and Error Detection across Languages in the Bi-GSM8K Math-Teaching Benchmark"
  venue: "Findings of EACL 2026"
  year: 2026
  date: 2026-03-24
  authors: ["Jieun Park", "KyungTae Lim", "Joon-ho Lim"]
  summary: "Bi-GSM8K is a bilingual English-Korean math-teaching benchmark with teacher solutions, simulated student solutions and first-error annotations; its step-alignment metric agrees with human judgments at Pearson 0.89, and open-source LLMs detect a student's first error with about 86% accuracy vs. 95% for GPT-4o."
  thumbnail: /assets/img/projects/bi-gsm8k.png
  thumbnail_alt: "A student's math solution aligned step by step with a teacher solution, with matching and missing steps and the first student error marked."
